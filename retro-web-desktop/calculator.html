<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>

    <div class="calc-container">
        <input type="text" id="display" value="0" readonly>

        <div class="button-grid">
            <button class="calc-btn" onclick="pressNumber('7')">7</button>
            <button class="calc-btn" onclick="pressNumber('8')">8</button>
            <button class="calc-btn" onclick="pressNumber('9')">9</button>
            <button class="calc-btn op-btn" onclick="pressOperator('/')">/</button>

            <button class="calc-btn" onclick="pressNumber('4')">4</button>
            <button class="calc-btn" onclick="pressNumber('5')">5</button>
            <button class="calc-btn" onclick="pressNumber('6')">6</button>
            <button class="calc-btn op-btn" onclick="pressOperator('*')">*</button>

            <button class="calc-btn" onclick="pressNumber('1')">1</button>
            <button class="calc-btn" onclick="pressNumber('2')">2</button>
            <button class="calc-btn" onclick="pressNumber('3')">3</button>
            <button class="calc-btn op-btn" onclick="pressOperator('-')">-</button>

            <button class="calc-btn clear-btn" onclick="clearCalc()">C</button>
            <button class="calc-btn" onclick="pressNumber('0')">0</button>
            <button class="calc-btn eq-btn" onclick="calculateResult()">=</button>
            <button class="calc-btn op-btn" onclick="pressOperator('+')">+</button>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
